<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stey.css">
</head>
<body>
     <div class="card">
    <h2>Создать аккаунт</h2>

    <div class="input-box">
      <label>Имя *</label>
      <input type="text" placeholder="Введите имя" required>
    </div>

    <div class="input-box">
      <label>Email</label>
      <input type="email" placeholder="example@mail.com">
    </div>

    <div class="input-box">
      <label>Пароль</label>
      <input type="password" placeholder="••••••••">
    </div>

    <div class="input-box">
      <label>Повторите пароль</label>
      <input type="password" placeholder="••••••••">
    </div>

    <div class="input-box">
      <label>Дата рождения</label>
      <input type="date">
    </div>

    <div class="input-box">
      <label>Пол</label>
      <div class="gender">
        <label><input type="radio" name="gender"> Мужской</label>
        <label><input type="radio" name="gender"> Женский</label>
      </div>
    </div>

    <div class="check">
      <input type="checkbox" checked>
      <span>Я согласен(на) с правилами сайта</span>
    </div>

    <button class="btn">Зарегистрироваться</button>

    <div class="footer-text">© 2025 Registration UI</div>
  </div>

</body>
</html>
